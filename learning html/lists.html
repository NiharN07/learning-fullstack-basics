<!DOCTYPE html>
<html lang="en">
<head>
    <title>My list</title>
</head>
<body>
    <ul>
        <li>Name 1</li>
        <li>Name 2</li>
        <li>Name 3</li>
    </ul>
    <ol>
        <li>Name 4</li>
        <li>Name 5</li>
        <li>Name 6</li>
    </ol>
    <dl>
        <dt>Name 1</dt>
        <dd>*this is the first name </dd>
        <dt>Name 2</dt>
        <dd>*this is the second name </dd>
    </dl>
    <div style="background-color: lightblue; color:red" >
        <h1>first div</h1>
        <b>this is bold text</b>
    </div>
    <div>
        <h2>second div</h2>
        <b>this is italic text</b>
    </div>
</body>
</html>
